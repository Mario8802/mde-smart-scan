[project]
name = "mde-smart-scan"
version = "0.1.0"
description = "Privacy-first OCR workflow prototype for registered postal items"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "Pillow>=11,<13",
  "pytesseract>=0.3.13,<0.4",
  "whitenoise>=6.9,<7",
  "gunicorn>=23,<24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-django>=4.11,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
